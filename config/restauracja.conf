# Konfiguracja restauracji. Format: klucz = wartość, komentarz od #.
# Wszystkie klucze są obowiązkowe, nieznane klucze są odrzucane.
# Czasy podane są w minutach restauracji.

# Godziny otwarcia Tp i Tk (HH:MM).
otwarcie = 10:00
zamkniecie = 18:00

# Ile milisekund prawdziwego czasu trwa minuta w restauracji.
minuta_ms = 100

# K: ile osób może być jednocześnie w restauracji.
miejsca = 30

# Menu w kolejności D1..D6, N1..N3.
ceny = 18.50, 21.00, 24.90, 15.00, 29.90, 12.00, 6.00, 7.50, 9.00

# P1..P9: pojemności pojemników w tej samej kolejności.
pojemniki = 6, 6, 5, 5, 4, 4, 8, 8, 8

# Klienci.
klienci_odstep_min = 1
klienci_odstep_max = 4
maks_procesow_klientow = 60
procent_bez_zamowienia = 2
procent_niepelnosprawnych = 1
procent_z_dziecmi = 15
maks_pozycji_w_zamowieniu = 5

# Czasy czynności (od, do).
gotowanie_min = 1
gotowanie_max = 4
obsluga_przy_kasie_min = 1
obsluga_przy_kasie_max = 3
jedzenie_min = 10
jedzenie_max = 25
lazienka_min = 2
lazienka_max = 6

# Ile minut nowo otwarta kasa musi działać, zanim można ją zamknąć.
kasa_min_czas_otwarcia = 10

# Opłata za łazienkę dla osób bez zakupu (zł).
oplata_lazienka = 5.00

# Katalog na logi.
katalog_logow = logs
